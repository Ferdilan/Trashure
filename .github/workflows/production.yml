name: Production CI/CD

on:
  push:
    branches:
      - main
      - production
  pull_request:
    branches:
      - main
      - production

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json
          
      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm install
        
      - name: Lint Frontend
        working-directory: ./frontend
        run: npm run lint
        
      - name: Build Frontend
        working-directory: ./frontend
        run: npm run build
        
      - name: Install Backend Dependencies
        working-directory: ./backend
        run: npm install
        
      # TODO: Tambahkan langkah deployment di sini
      # Contoh untuk frontend: deploy ke Vercel/Netlify
      # Contoh untuk backend: deploy ke server (misal via SSH) atau Docker container registry
      - name: Ready for Deployment
        run: echo "Proyek siap di-deploy ke production!"
